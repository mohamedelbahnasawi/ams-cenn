name: smoke

# Two checks on every push:
#   install-import   - the repository is pip-installable and the AMS-CeNN model imports and builds;
#   reproduce-tables - in the same fresh environment, every manuscript table and the significance
#                      statistics regenerate from the tracked per-seed result files and match the
#                      committed copies under experiments/expected/ (reproducibility, REQ-11).

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  install-import:
    name: install + construct AMS-CeNN
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package
        run: pip install -e .
      - name: Import + construct AMS-CeNN
        run: python -c "from neuralforecast.models import CeNN; m=CeNN(h=8,input_size=16,n_series=3,hidden_dim=8,K=2,adaptive_tau=True,multiscale_mode='parallel_ensemble',linear_skip=True); print('AMS-CeNN OK:', sum(p.numel() for p in m.parameters()), 'params')"

  reproduce-tables:
    name: regenerate paper tables from the tracked results
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package + analysis dependencies
        run: |
          pip install -e .
          pip install scipy scikit-posthocs matplotlib
      - name: Regenerate and compare
        run: python experiments/verify_reproduction.py
